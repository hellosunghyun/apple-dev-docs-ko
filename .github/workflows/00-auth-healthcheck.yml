name: Codex OAuth Healthcheck

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/setup-codex-auth
        with:
          codex-auth-json: ${{ secrets.CODEX_AUTH_JSON }}
      - name: Verify Codex
        run: codex exec --ephemeral "Return exactly OK."
