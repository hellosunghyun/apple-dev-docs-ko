name: Translate POC

on:
  workflow_dispatch:
    inputs:
      limit_files:
        default: "100"
        required: true
      gemini_model:
        default: "gemini-3.1-flash-lite"
        required: true
      gemini_reviewer_model:
        default: "gemini-3.1-flash-lite"
        required: true
      gemini_review_enabled:
        default: "true"
        required: true
      gemini_review_sample_rate:
        default: "0.05"
        required: true

permissions:
  contents: write

jobs:
  translate-poc:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Require Gemini API key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$GEMINI_API_KEY" || {
            echo "::error::GEMINI_API_KEY secret is empty or unavailable";
            exit 1;
          }
      - name: Show Gemini model configuration
        env:
          GEMINI_MODEL: ${{ inputs.gemini_model }}
          GEMINI_REVIEWER_MODEL: ${{ inputs.gemini_reviewer_model }}
          GEMINI_REVIEW_ENABLED: ${{ inputs.gemini_review_enabled }}
          GEMINI_REVIEW_SAMPLE_RATE: ${{ inputs.gemini_review_sample_rate }}
        run: |
          echo "Gemini translation model: ${GEMINI_MODEL}"
          echo "Gemini reviewer model: ${GEMINI_REVIEWER_MODEL}"
          echo "Gemini review enabled: ${GEMINI_REVIEW_ENABLED}"
          echo "Gemini review sample rate: ${GEMINI_REVIEW_SAMPLE_RATE}"
      - run: pnpm run upstream:sync
      - run: pnpm run manifest
      - run: pnpm tsx scripts/segmenter/split-segments.ts --limit-files "${{ inputs.limit_files }}"
      - run: pnpm tsx scripts/translate/build-queue.ts --limit-files "${{ inputs.limit_files }}" --batch-segments 180 --batch-chars 60000
      - name: Translate with Gemini
        env:
          TRANSLATION_PROVIDER: gemini-api
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.gemini_model }}
          GEMINI_REVIEWER_MODEL: ${{ inputs.gemini_reviewer_model }}
          GEMINI_REVIEW_ENABLED: ${{ inputs.gemini_review_enabled }}
          GEMINI_REVIEW_SAMPLE_RATE: ${{ inputs.gemini_review_sample_rate }}
          GEMINI_TIMEOUT_MS: "900000"
          GEMINI_RETRIES: "1"
          LLM_CONCURRENCY: "1"
        run: pnpm run translate
      - run: pnpm tsx scripts/translate/apply-results.ts
      - run: pnpm run render
      - run: pnpm run site:build
      - run: pnpm run report
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add state translation-memory translations site/src/content site/src/data site/public/frameworks.json site/public/navigation.json site/public/segment-maps site/public/search site/public/status reports
          git commit -m "feat: 번역 실험 결과 갱신" || echo "No changes"
          git push
