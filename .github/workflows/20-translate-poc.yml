name: Translate POC

on:
  workflow_dispatch:
    inputs:
      limit_files:
        default: "100"
        required: true

permissions:
  contents: write

jobs:
  translate-poc:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-codex-auth
        with:
          codex-auth-json: ${{ secrets.CODEX_AUTH_JSON }}
      - run: pnpm run upstream:sync
      - run: pnpm run manifest
      - run: pnpm tsx scripts/segmenter/split-segments.ts --limit-files "${{ inputs.limit_files }}"
      - run: pnpm tsx scripts/translate/build-queue.ts --limit-files "${{ inputs.limit_files }}"
      - run: LLM_CONCURRENCY=3 pnpm run translate
      - run: pnpm tsx scripts/translate/apply-results.ts
      - run: pnpm run render
      - run: pnpm run site:build
      - run: pnpm run report
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add state translation-memory translations site/src/content site/src/data site/public/source-maps site/public/search site/public/status reports
          git commit -m "feat: 번역 실험 결과 갱신" || echo "No changes"
          git push
