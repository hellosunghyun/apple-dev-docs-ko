name: Maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: "30 9 * * 1"

permissions:
  contents: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run validate
      - run: pnpm run site:build
      - run: pnpm run report
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add reports site/src/data site/public/status
          git commit -m "feat: 운영 리포트 갱신" || echo "No changes"
          git push

