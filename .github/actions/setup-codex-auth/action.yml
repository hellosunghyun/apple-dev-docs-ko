name: Setup Codex OAuth
description: Install Codex CLI and seed CODEX_AUTH_JSON for trusted automation jobs.

inputs:
  codex-auth-json:
    description: Contents of CODEX_AUTH_JSON secret.
    required: true
  codex-version:
    description: Codex CLI npm package version to install.
    required: false
    default: "0.130.0"

runs:
  using: composite
  steps:
    - name: Install Codex CLI
      shell: bash
      run: |
        npm install -g "@openai/codex@${{ inputs.codex-version }}"
        codex --version

    - name: Seed Codex auth
      shell: bash
      env:
        CODEX_AUTH_JSON: ${{ inputs.codex-auth-json }}
      run: |
        if [ -z "${CODEX_AUTH_JSON:-}" ]; then
          echo "::error::CODEX_AUTH_JSON secret is empty or unavailable"
          exit 1
        fi

        export CODEX_HOME="${CODEX_HOME:-$HOME/.codex}"
        mkdir -p "$CODEX_HOME"
        chmod 700 "$CODEX_HOME"
        printf "%s" "$CODEX_AUTH_JSON" > "$CODEX_HOME/auth.json"
        chmod 600 "$CODEX_HOME/auth.json"
