preserve:
  - SwiftUI
  - UIKit
  - AppKit
  - Core Motion
  - SensorKit
  - Create ML
  - RealityKit
  - AVFoundation
  - App Store
  - WidgetKit
  - Live Activities
  - API
  - SDK
  - framework
  - protocol
  - struct
  - class
  - enum
  - property
  - method
  - initializer
  - modifier

translations:
  authorization: "권한 부여"
  privacy: "개인정보 보호"
  capability: "기능"
  entitlement: "엔타이틀먼트"
  sample code: "샘플 코드"

style:
  tone: "간결한 한국어 기술 문서체"
  sentenceEnding: "합니다"
  avoid:
    - "당신"
    - "하십시오"
    - "합니다만"

