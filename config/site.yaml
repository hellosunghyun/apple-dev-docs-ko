site:
  name: "Apple Dev Docs KO"
  deploy: "github-pages"
  framework: "astro"
  base: "/"
  sourceView:
    enabled: true
    defaultMode: "ko_only"
    publicSourcePolicy: "sentence_source_public"
    modes:
      - "ko_only"
      - "sentence_popover"
      - "inline_original"
      - "side_by_side"
  disclaimer:
    showTopBar: true
    showDocNotice: true
    showFooter: true
  appleLogo: false
  dataCollection: false

