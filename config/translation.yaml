translation:
  provider: "gemini-api"
  language: "ko"
  unit: "sentence_segment"
  memoryDir: "translation-memory"
  batchSegments: 180
  batchChars: 60000
  retries: 1
  llmConcurrencyPerRunner: 1
  maxParallelRunnerJobs: 32
  preserveHumanOverrides: true
  renderSourceSentenceMap: true
  allowMockTranslator: true
  gemini:
    model: "gemini-3.1-flash-lite"
    reviewerModel: "gemini-3.1-flash-lite"
    reviewEnabled: true
    inputPricePerMillionTokens: 0.25
    outputPricePerMillionTokens: 1.50
