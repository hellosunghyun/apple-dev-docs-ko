translation:
  provider: "codex-cli-oauth"
  language: "ko"
  unit: "sentence_segment"
  memoryDir: "translation-memory"
  batchSegments: 60
  batchChars: 16000
  retries: 1
  llmConcurrencyPerRunner: 3
  maxParallelRunnerJobs: 20
  preserveHumanOverrides: true
  renderSourceSentenceMap: true
  allowMockTranslator: true
